[package]
name = "imeoff-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "imeoff"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_Ime",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
